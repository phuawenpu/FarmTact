<!doctype html>
<html lang="en">
<meta charset="utf-8">
<title>FarmTact crop and advisor art contact sheet</title>
<style>
  * { box-sizing: border-box } body { margin: 0; padding: 28px; color: #18392b; background: #f5efdf; font: 14px/1.35 system-ui, sans-serif }
  h1 { margin: 0 0 6px; font-size: 28px } h2 { margin: 28px 0 12px; font-size: 18px } p { margin: 0; color: #58685d }
  .grid { display: grid; grid-template-columns: repeat(6, 1fr); gap: 12px }
  figure { margin: 0; min-width: 0; padding: 10px; border: 1px solid #d7d0bc; border-radius: 14px; background: #fffaf0 }
  figure div { height: 108px; display: grid; place-items: center; overflow: hidden; border-radius: 10px; background: linear-gradient(165deg,#eef2d8,#d9e2bd) }
  img { width: 120px; height: 100px; object-fit: contain } figcaption { padding-top: 7px; font-size: 11px; font-weight: 750; overflow-wrap: anywhere }
  .advisors figure div { height: 132px; background: #ece7d8 } .advisors img { width: 120px; height: 120px }
</style>
<body>
  <h1>FarmTact original art contact sheet</h1>
  <p>Four simulated crops × three stages, six mature almanac crops, and six advisor portraits.</p>
  <h2>Stage sets</h2>
  <section class="grid">
    <figure><div><img src="../apps/web/public/art/crops/caixin-seedling.svg"></div><figcaption>Caixin · seedling</figcaption></figure>
    <figure><div><img src="../apps/web/public/art/crops/caixin-growing.svg"></div><figcaption>Caixin · growing</figcaption></figure>
    <figure><div><img src="../apps/web/public/art/crops/caixin-ready.svg"></div><figcaption>Caixin · ready</figcaption></figure>
    <figure><div><img src="../apps/web/public/art/crops/pak_choi-seedling.svg"></div><figcaption>Pak choi · seedling</figcaption></figure>
    <figure><div><img src="../apps/web/public/art/crops/pak_choi-growing.svg"></div><figcaption>Pak choi · growing</figcaption></figure>
    <figure><div><img src="../apps/web/public/art/crops/pak_choi-ready.svg"></div><figcaption>Pak choi · ready</figcaption></figure>
    <figure><div><img src="../apps/web/public/art/crops/kailan-seedling.svg"></div><figcaption>Kailan · seedling</figcaption></figure>
    <figure><div><img src="../apps/web/public/art/crops/kailan-growing.svg"></div><figcaption>Kailan · growing</figcaption></figure>
    <figure><div><img src="../apps/web/public/art/crops/kailan-ready.svg"></div><figcaption>Kailan · ready</figcaption></figure>
    <figure><div><img src="../apps/web/public/art/crops/lettuce-seedling.svg"></div><figcaption>Lettuce · seedling</figcaption></figure>
    <figure><div><img src="../apps/web/public/art/crops/lettuce-growing.svg"></div><figcaption>Lettuce · growing</figcaption></figure>
    <figure><div><img src="../apps/web/public/art/crops/lettuce-ready.svg"></div><figcaption>Lettuce · ready</figcaption></figure>
  </section>
  <h2>Mature almanac crops</h2>
  <section class="grid">
    <figure><div><img src="../apps/web/public/art/crops/bayam-ready.svg"></div><figcaption>Bayam</figcaption></figure>
    <figure><div><img src="../apps/web/public/art/crops/kangkong-ready.svg"></div><figcaption>Kangkong</figcaption></figure>
    <figure><div><img src="../apps/web/public/art/crops/kale-ready.svg"></div><figcaption>Curly kale</figcaption></figure>
    <figure><div><img src="../apps/web/public/art/crops/mustard_greens-ready.svg"></div><figcaption>Mustard greens</figcaption></figure>
    <figure><div><img src="../apps/web/public/art/crops/malabar_spinach-ready.svg"></div><figcaption>Malabar spinach</figcaption></figure>
    <figure><div><img src="../apps/web/public/art/crops/sweet_potato_leaves-ready.svg"></div><figcaption>Sweet-potato shoots</figcaption></figure>
  </section>
  <h2>Advisor characters</h2>
  <section class="grid advisors">
    <figure><div><img src="../apps/web/public/art/advisors/mei.svg"></div><figcaption>Mei · crop scientist</figcaption></figure>
    <figure><div><img src="../apps/web/public/art/advisors/ravi.svg"></div><figcaption>Ravi · demand analyst</figcaption></figure>
    <figure><div><img src="../apps/web/public/art/advisors/hana.svg"></div><figcaption>Hana · weather scout</figcaption></figure>
    <figure><div><img src="../apps/web/public/art/advisors/ben.svg"></div><figcaption>Ben · resource analyst</figcaption></figure>
    <figure><div><img src="../apps/web/public/art/advisors/asha.svg"></div><figcaption>Asha · planning chair</figcaption></figure>
    <figure><div><img src="../apps/web/public/art/advisors/idris.svg"></div><figcaption>Idris · independent critic</figcaption></figure>
  </section>
</body>
</html>
