<title id="title">FarmTact: numerical authority and optional AI interpretation</title><desc id="desc">Synthetic and imported farm snapshots feed local forecast, optimizer and simulation. Public context feeds the interface and optional DeepSeek interpretation. Only backend validation may accept simulation; no actual farm operations.</desc>
