<text x="40" y="566" font-family="DejaVu Sans, sans-serif" font-size="15" font-weight="normal" fill="#526b67" text-anchor="start">Figure 2. Continuous spans illustrate durations. Daily bed occupancy includes harvest + sanitation through that day.</text>
<text x="40" y="590" font-family="DejaVu Sans, sans-serif" font-size="15" font-weight="normal" fill="#526b67" text-anchor="start">The earliest next transplant is harvest + sanitation + 1 day. Shelf-life expiration is a separate inventory rule.</text>
