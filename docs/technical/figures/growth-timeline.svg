<svg xmlns="http://www.w3.org/2000/svg" width="1360" height="610" viewBox="0 0 1360 610" role="img" aria-labelledby="title desc">
<title id="title">Plant development is a recipe calendar</title><desc id="desc">Four synthetic crop recipes show nursery duration, grow-out, harvest instant, sanitation interval and stock shelf-life. These are engineering assumptions, not measured growth curves.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#526b67"/></marker></defs>
